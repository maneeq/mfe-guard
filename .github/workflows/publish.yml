name: publish
# Stages a release whenever main has a package.json version that is not on npm yet.
# It does NOT make the release live: a maintainer approves the staged version with 2FA,
# on npmjs.com or with `npm stage approve <stage-id> --otp=<code>`.
# To release: bump "version" in package.json and push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    # The "npm:" environment holds the NPM_TOKEN secret (a stage-only npm token).
    environment: "npm:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check whether this version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, nothing to do."
            echo "stage=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will stage $NAME@$VERSION"
            echo "stage=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.stage == 'true'
        name: Use npm 11.21 (npm stage needs 11.15+)
        run: npm install -g npm@11.21.0
      - if: steps.check.outputs.stage == 'true'
        run: npm ci
      - if: steps.check.outputs.stage == 'true'
        name: Stage the release (goes live only after a maintainer approves it with 2FA)
        run: npm stage publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
